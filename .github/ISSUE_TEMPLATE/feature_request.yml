name: Feature request
description: Something you'd like the app to edit or show
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to do?
      description: Describe what you'd change in your save, and why.
      placeholder: I'd like to change which villager a farmer is married to.
    validations:
      required: true

  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: In the game, with a mod, by editing the save by hand… or not at all.

  - type: dropdown
    id: farm
    attributes:
      label: Farm type
      options:
        - Single player
        - Multiplayer
        - Both